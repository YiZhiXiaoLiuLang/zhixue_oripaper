<!DOCTYPE html>
<html>
<head>
    <title>日志文件列表</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px; }
        a { text-decoration: none; color: #1a73e8; }
        a:hover { text-decoration: underline; }
        .file-size { color: #666; font-size: 0.9em; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>日志文件列表</h1>
    <ul>
        {% for file in files %}
        <li>
            <a href="{{ url_for('preview_log_file', filename=file) }}">{{ file }}</a>
            <span class="file-size">懒得写计算文件大小不写了
            </span>
        </li>
        {% else %}
        <li>没有找到日志文件</li>
        {% endfor %}
    </ul>
</body>
</html>
