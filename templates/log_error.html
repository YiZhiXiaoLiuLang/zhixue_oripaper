<!DOCTYPE html>
<html>
<head>
    <title>错误</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .error { color: #d93025; padding: 20px; background: #fce8e6; border-radius: 4px; }
        .actions { margin-top: 20px; }
        .btn {
            display: inline-block;
            padding: 8px 15px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>操作失败</h1>
    <div class="error">{{ message }}</div>
    
    <div class="actions">
        <a href="{{ url_for('list_log_files') }}" class="btn">返回列表</a>
        {% if filename %}
        <a href="{{ url_for('download_file', filename=filename) }}" class="btn">尝试下载</a>
        {% endif %}
    </div>
</body>
</html>
