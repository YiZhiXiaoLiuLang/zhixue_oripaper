<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点选择</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        .description {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 20px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
        }
        
        .current-path {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-family: monospace;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .nodes-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .node-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 320px;
            text-align: center;
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .node-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        
        .node-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }
        
        .node-card:hover:before {
            left: 100%;
        }
        
        .node-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        
        .dev .node-icon {
            color: #4CAF50;
        }
        
        .test .node-icon {
            color: #FFC107;
        }
        
        .public .node-icon {
            color: #2196F3;
        }
        
        .node-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .node-url {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            display: inline-block;
            margin: 15px 0;
            word-break: break-all;
            text-align: center;
            width: 100%;
        }
        
        .node-desc {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.5;
            min-height: 70px;
        }
        
        .select-btn {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .select-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .footer {
            margin-top: 50px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .nodes-container {
                flex-direction: column;
                align-items: center;
            }
            
            .node-card {
                width: 100%;
                max-width: 400px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-server"></i> 节点选择器</h1>
            <p class="description">请选择您需要连接的服务器节点。选择后系统将自动跳转到对应节点的目标页面。</p>
            <div class="current-path">当前路径参数: /api/v1/nodechoose?next=/index.html</div>
        </header>
        
        <div class="nodes-container">
            <div class="node-card dev" data-url="http://localhost:8080">
                <div class="node-icon">
                    <i class="fas fa-laptop-code"></i>
                </div>
                <h2 class="node-title">呼和浩特缓存节点[土ber鼠]</h2>
                <div class="node-url">http://39.99.41.233:51000</div>
                <p class="node-desc">推荐。仅缓存，不进行实时获取。稳定性最高，网速最快，但新考试需要12~48小时刷新缓存。</p>
                             
                <a href="#" class="select-btn">选择此节点</a>
            </div>
            
            <div class="node-card test" data-url="http://8.140.196.172:8080">
                <div class="node-icon">
                    <i class="fas fa-vial"></i>
                </div>
                <h2 class="node-title">西安测试节点</h2>
                <div class="node-url">http://39.99.41.233:65000</div>
                <p class="node-desc">测试环境服务器，用于质量保证和用户验收测试。</p>
                <a href="#" class="select-btn">选择此节点</a>
            </div>
            <!--
            <div class="node-card public" data-url="http://8.140.196.172">
                <div class="node-icon">
                    <i class="fas fa-globe"></i>
                </div>
                
                <h2 class="node-title">公用节点</h2>
                <div class="node-url">http://8.140.196.172</div>
                <p class="node-desc">公共生产环境，面向所有用户提供服务。</p>
                <a href="#" class="select-btn">选择此节点</a>
            </div>
            -->
        </div>
    </div>
    
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span>正在跳转到目标节点...</span>
    </div>
    
    <div class="footer">
        <p>节点选择服务 &copy; 2023 | 系统版本 v1.2.0</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取所有节点卡片
            const nodeCards = document.querySelectorAll('.node-card');
            const notification = document.getElementById('notification');
            
            // 从URL参数中获取next路径
            const urlParams = new URLSearchParams(window.location.search);
            const nextPath = urlParams.get('next') || '/index.html';
            
            // 为每个节点卡片添加点击事件
            nodeCards.forEach(card => {
                const selectBtn = card.querySelector('.select-btn');
                
                // 整个卡片和按钮都可点击
                [card, selectBtn].forEach(element => {
                    element.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        // 获取节点基础URL
                        const baseUrl = card.getAttribute('data-url');
                        
                        // 构建完整URL
                        const targetUrl = baseUrl + nextPath;
                        
                        // 显示通知
                        notification.querySelector('span').textContent = `正在跳转到: ${targetUrl}`;
                        notification.classList.add('show');
                        
                        // 2秒后跳转
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 2000);
                    });
                });
            });
        });
    </script>
</body>
</html>
